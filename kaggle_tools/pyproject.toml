[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kaggle-tools"
version = "0.2.0"
description = "Kaggle AI 额度工具集: kllm (本地 OpenAI 兼容网关) 与 kcloud (云端代码生成评测驱动)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaggle==2.2.4",
    "kaggle-benchmarks==0.6.1",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.0",
]

[project.scripts]
kllm = "kaggle_tools.kllm.cli:main"
kcloud = "kaggle_tools.cloud.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: 真实调用 Kaggle 服务, 会消耗额度; 用 -m live 显式开启"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples", "runs", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# 任务源码靠 build 时内联 _workspace_tools.py, 星号导入是有意为之。
"src/kaggle_tools/tasks_src/*.py" = ["F403", "F405", "E402"]
